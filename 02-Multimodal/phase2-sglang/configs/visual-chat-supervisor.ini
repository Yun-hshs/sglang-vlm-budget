[unix_http_server]
file=%(ENV_CHAT_STACK_RUN)s/control.sock
chmod=0600

[supervisord]
pidfile=%(ENV_CHAT_STACK_RUN)s/supervisord.pid
logfile=%(ENV_CHAT_STACK_RUN)s/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
childlogdir=%(ENV_CHAT_STACK_RUN)s
umask=077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_CHAT_STACK_RUN)s/control.sock

[program:sglang]
command=%(ENV_CHAT_STACK_ROOT)s/scripts/run_visual_chat_component.sh engine
directory=%(ENV_CHAT_STACK_ROOT)s
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=15
stopasgroup=true
killasgroup=true
stopwaitsecs=25
redirect_stderr=true
stdout_logfile=%(ENV_CHAT_STACK_RUN)s/sglang.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:web]
command=%(ENV_CHAT_STACK_ROOT)s/scripts/run_visual_chat_component.sh web
directory=%(ENV_CHAT_STACK_ROOT)s
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=15
stopasgroup=true
killasgroup=true
stopwaitsecs=8
redirect_stderr=true
stdout_logfile=%(ENV_CHAT_STACK_RUN)s/web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

[program:ngrok]
command=%(ENV_CHAT_STACK_ROOT)s/scripts/run_visual_chat_component.sh ngrok
directory=%(ENV_CHAT_STACK_ROOT)s
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=15
stopasgroup=true
killasgroup=true
stopwaitsecs=8
redirect_stderr=true
stdout_logfile=%(ENV_CHAT_STACK_RUN)s/ngrok.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:health]
command=%(ENV_PYTHON_BIN)s -m deployment.visual_chat_health
directory=%(ENV_CHAT_STACK_ROOT)s
priority=40
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=%(ENV_CHAT_STACK_RUN)s/health.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
